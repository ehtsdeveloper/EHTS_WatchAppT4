[versions]
agp = "8.13.2"
kotlin = "2.0.0"
coreSplashscreen = "1.0.1"
activityCompose = "1.9.3"
composeBom = "2024.11.00"
uiTooling = "1.7.5"
wearCompose = "1.4.0"
playServicesWearable = "19.0.0"
healthServices = "1.1.0-alpha04"
firebaseBom = "34.7.0"

[libraries]
# Android Core & Wear
coreSplashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
activityCompose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
playServicesWearable = { group = "com.google.android.gms", name = "play-services-wearable", version.ref = "playServicesWearable" }
healthServices = { group = "androidx.health", name = "health-services-client", version.ref = "healthServices" }

# Compose UI
composeBom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
composeUi = { group = "androidx.compose.ui", name = "ui" }
composeUiGraphics = { group = "androidx.compose.ui", name = "ui-graphics" }
composeUiTooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "uiTooling" }
composeUiToolingPreview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
composeUiTestManifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
composeUiTestJunit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }

# Wear Compose
wearComposeMaterial = { group = "androidx.wear.compose", name = "compose-material", version.ref = "wearCompose" }
wearComposeFoundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "wearCompose" }

# FIREBASE
firebaseBom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebaseAnalytics = { group = "com.google.firebase", name = "firebase-analytics" }
firebaseFirestore = { group = "com.google.firebase", name = "firebase-firestore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }